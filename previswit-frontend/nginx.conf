# =============================================================================
# nginx.conf — PreviSwit Frontend (MPA)
# Serve páginas HTML estáticas com Tailwind CDN
# Proxy reverso: /api/* e /ws/* → previswit-server:10000
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compressão Gzip ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/html text/javascript
               application/javascript application/json image/svg+xml;

    # ── Raiz: redireciona para /login/ ────────────────────────────────────────
    location = / {
        return 301 /login/;
    }

    # ── Login: serve os arquivos HTML da pasta /login/ ────────────────────────
    location /login/ {
        try_files $uri $uri/ /login/index.html;
    }

    # ── Dashboard: serve os HTMLs da pasta /dashboard/ ────────────────────────
    location = /dashboard {
        return 301 /dashboard/;
    }

    location /dashboard/ {
        try_files $uri $uri/ /dashboard/index.html;
    }

    # ── index.css: serve o CSS global referenciado como ../index.css ──────────
    location = /index.css {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── Proxy Reverso: API REST → previswit-server ────────────────────────────
    location /api/ {
        proxy_pass         http://previswit-server:10000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── Proxy WebSocket: /ws/* → previswit-server ─────────────────────────────
    location /ws/ {
        proxy_pass         http://previswit-server:10000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Proxy Auth endpoints ──────────────────────────────────────────────────
    location /auth/ {
        proxy_pass         http://previswit-server:10000;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Segurança ─────────────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;

    server_tokens off;
}
