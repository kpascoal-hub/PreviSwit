<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PreviSwit ASPM - Login</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../index.css">
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden bg-[#060b13]">
    
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-900/20 via-[#060b13] to-[#060b13]"></div>

    <div class="glass-panel w-full max-w-md p-10 relative z-10">
        
        <div class="mb-10 text-center">
            <h1 class="text-3xl font-bold tracking-tight text-white mb-2">PreviSwit ASPM</h1>
            <p class="text-xs text-gray-400 tracking-widest uppercase font-semibold">Autenticação do Sistema</p>
        </div>

        <div id="error-banner" class="hidden mb-6 p-4 rounded bg-red-500/10 border border-red-500/30 text-red-400 text-sm text-center font-medium">
            Credenciais inválidas.
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label for="username" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Identificador (Usuário)</label>
                <input type="text" id="username" name="username" required autocomplete="off"
                    class="w-full bg-[#03050a]/60 border border-gray-700/50 rounded px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-blue-500/80 focus:ring-1 focus:ring-blue-500/80 transition-all"
                    placeholder="Insira o seu ID">
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="password" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Chave de Segurança (Senha)</label>
                    <a href="/login/forgot-password.html" class="text-xs font-semibold text-blue-500 hover:text-blue-400 transition-colors">Esqueceu-se da senha?</a>
                </div>
                <input type="password" id="password" name="password" required
                    class="w-full bg-[#03050a]/60 border border-gray-700/50 rounded px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-blue-500/80 focus:ring-1 focus:ring-blue-500/80 transition-all"
                    placeholder="••••••••">
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 text-white font-semibold py-3 px-4 rounded hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 focus:ring-offset-[#060b13] transition-colors mt-4 shadow-lg shadow-blue-900/20">
                Acessar Plataforma
            </button>
        </form>

    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(event) {
            // Impede o recarregamento falso da página
            event.preventDefault();
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorBanner = document.getElementById('error-banner');

            // Sanitização de Inputs (Anti-Injection / Regex)
            const isSafe = (str) => /^[a-zA-Z0-9]+$/.test(str);

            if (!isSafe(user) || !isSafe(pass)) {
                errorBanner.textContent = "Credenciais inválidas ou formato não permitido.";
                errorBanner.classList.remove('hidden');
                return; // Interrompe a execução
            }

            if (user === 'admin' && pass === 'admin') {
                errorBanner.classList.add('hidden');
                // Criação de Sessão
                sessionStorage.setItem('previswit_auth', 'secure_token_active');
                // Redirecionamento para a SPA do Dashboard
                window.location.href = "/dashboard/";
            } else {
                errorBanner.textContent = "Credenciais inválidas.";
                errorBanner.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
