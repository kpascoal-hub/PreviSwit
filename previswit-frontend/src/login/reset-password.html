<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PreviSwit ASPM - Redefinir Senha</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../index.css">
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden bg-[#060b13]">
    
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-900/20 via-[#060b13] to-[#060b13]"></div>

    <div class="glass-panel w-full max-w-md p-10 relative z-10">
        
        <div class="mb-10 text-center">
            <h1 class="text-3xl font-bold tracking-tight text-white mb-2">Redefinir Senha</h1>
            <p class="text-xs text-gray-400 tracking-widest uppercase font-semibold">PreviSwit ASPM</p>
        </div>

        <div id="message-banner" class="hidden mb-6 p-4 rounded text-sm text-center font-medium"></div>

        <!-- Carregamento -->
        <div id="loading-state" class="text-center py-6">
            <p class="text-gray-400 text-sm">A validar o link de segurança...</p>
        </div>

        <!-- Formulário (Escondido inicialmente) -->
        <form id="reset-password-form" class="space-y-6 hidden">
            <div>
                <label for="new_password" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Nova Senha</label>
                <input type="password" id="new_password" name="new_password" required
                    class="w-full bg-[#03050a]/60 border border-gray-700/50 rounded px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-blue-500/80 focus:ring-1 focus:ring-blue-500/80 transition-all"
                    placeholder="Mínimo 8 caracteres, números e maiúsculas">
                <p class="text-[10px] text-gray-500 mt-1">A senha deve ter pelo menos 8 caracteres, uma letra maiúscula e um número.</p>
            </div>

            <div>
                <label for="confirm_password" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Confirmar Nova Senha</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                    class="w-full bg-[#03050a]/60 border border-gray-700/50 rounded px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-blue-500/80 focus:ring-1 focus:ring-blue-500/80 transition-all"
                    placeholder="Repita a senha">
            </div>

            <button type="submit" id="submit-btn"
                class="w-full bg-blue-600 text-white font-semibold py-3 px-4 rounded hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 focus:ring-offset-[#060b13] transition-colors mt-4 shadow-lg shadow-blue-900/20">
                Guardar Nova Senha
            </button>
            
            <div class="text-center mt-6">
                <a href="/login/" class="text-sm text-blue-500 hover:text-blue-400 transition-colors">Voltar ao Login</a>
            </div>
        </form>

        <!-- Ação Alternativa (Se falhar a validação) -->
        <div id="fallback-action" class="hidden text-center mt-6">
            <a href="/login/forgot-password.html" class="inline-block bg-gray-800 text-white font-semibold py-2 px-6 rounded hover:bg-gray-700 transition-colors">Solicitar Novo Link</a>
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const uid = urlParams.get('uid');
        const token = urlParams.get('token');

        const messageBanner = document.getElementById('message-banner');
        const loadingState = document.getElementById('loading-state');
        const resetForm = document.getElementById('reset-password-form');
        const fallbackAction = document.getElementById('fallback-action');

        function showMessage(msg, isError = false) {
            messageBanner.textContent = msg;
            messageBanner.className = `mb-6 p-4 rounded ${isError ? 'bg-red-500/10 border-red-500/30 text-red-400' : 'bg-green-500/10 border-green-500/30 text-green-400'} border text-sm text-center font-medium block`;
        }

        // 1. Validar o token ao abrir a página
        async function validateToken() {
            if (!uid || !token) {
                loadingState.classList.add('hidden');
                showMessage("Link de recuperação inválido ou corrompido.", true);
                fallbackAction.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch(`http://localhost:10000/auth/validate-token?uid=${encodeURIComponent(uid)}&token=${encodeURIComponent(token)}`);
                const data = await response.json();

                loadingState.classList.add('hidden');

                if (response.ok && data.valid) {
                    // Token válido, mostrar formulário
                    resetForm.classList.remove('hidden');
                } else {
                    // Token inválido ou expirado
                    showMessage(data.message || "O link expirou ou já foi utilizado.", true);
                    fallbackAction.classList.remove('hidden');
                }
            } catch (error) {
                loadingState.classList.add('hidden');
                showMessage("Erro de ligação ao servidor. Tente novamente mais tarde.", true);
            }
        }

        // 2. Submeter nova password
        document.getElementById('reset-password-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const new_password = document.getElementById('new_password').value;
            const confirm_password = document.getElementById('confirm_password').value;
            const submitBtn = document.getElementById('submit-btn');

            if (new_password !== confirm_password) {
                showMessage("As senhas não coincidem.", true);
                return;
            }

            // Disable button and show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'A guardar...';
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                const response = await fetch('http://localhost:10000/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        uid: uid,
                        token: token,
                        new_password: new_password,
                        confirm_password: confirm_password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(data.message || "Senha atualizada com sucesso.");
                    resetForm.classList.add('hidden');
                    
                    // Redirecionar para o login após 3 segundos
                    setTimeout(() => {
                        window.location.href = "/login/";
                    }, 3000);
                } else {
                    // Exibir detalhe do erro do Pydantic ou da API (ex: complexidade de senha)
                    let errorMsg = data.detail || "Ocorreu um erro ao atualizar a senha.";
                    if (Array.isArray(data.detail)) {
                        errorMsg = data.detail.map(e => e.msg).join(" | ");
                    }
                    showMessage(errorMsg, true);
                }
                
            } catch (error) {
                showMessage("Erro de ligação ao servidor. Tente novamente mais tarde.", true);
            } finally {
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Guardar Nova Senha';
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });

        // Iniciar validação
        window.addEventListener('load', validateToken);
    </script>
</body>
</html>
