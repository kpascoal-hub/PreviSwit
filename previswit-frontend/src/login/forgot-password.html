<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PreviSwit ASPM - Recuperar Senha</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../index.css">
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden bg-[#060b13]">
    
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-900/20 via-[#060b13] to-[#060b13]"></div>

    <div class="glass-panel w-full max-w-md p-10 relative z-10">
        
        <div class="mb-10 text-center">
            <h1 class="text-3xl font-bold tracking-tight text-white mb-2">Recuperar Senha</h1>
            <p class="text-xs text-gray-400 tracking-widest uppercase font-semibold">PreviSwit ASPM</p>
        </div>

        <div id="message-banner" class="hidden mb-6 p-4 rounded text-sm text-center font-medium"></div>

        <form id="forgot-password-form" class="space-y-6">
            <p class="text-sm text-gray-300 text-center mb-6">
                Introduza o endereço de e-mail associado à sua conta. Se o e-mail existir no nosso sistema, enviaremos um link para redefinir a sua senha.
            </p>

            <div>
                <label for="email" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Endereço de E-mail</label>
                <input type="email" id="email" name="email" required autocomplete="email"
                    class="w-full bg-[#03050a]/60 border border-gray-700/50 rounded px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-blue-500/80 focus:ring-1 focus:ring-blue-500/80 transition-all"
                    placeholder="exemplo@dominio.com">
            </div>

            <button type="submit" id="submit-btn"
                class="w-full bg-blue-600 text-white font-semibold py-3 px-4 rounded hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 focus:ring-offset-[#060b13] transition-colors mt-4 shadow-lg shadow-blue-900/20">
                Enviar E-mail de Recuperação
            </button>
            
            <div class="text-center mt-6">
                <a href="/login/" class="text-sm text-blue-500 hover:text-blue-400 transition-colors">Voltar ao Login</a>
            </div>
        </form>

    </div>

    <script>
        document.getElementById('forgot-password-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const messageBanner = document.getElementById('message-banner');
            const submitBtn = document.getElementById('submit-btn');

            // Disable button and show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'A enviar...';
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                // Em produção, usar um reverse proxy /api/auth/... se existir
                // Aqui enviamos direto para o PreviSwit Server no porto 10000
                const response = await fetch('http://localhost:10000/auth/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                // Sucesso (mesmo padrão DefectDojo - 202 Accepted)
                messageBanner.textContent = data.message || "Se o endereço de e-mail estiver registado no sistema, receberá em breve um link para recuperar a sua password.";
                messageBanner.className = 'mb-6 p-4 rounded bg-green-500/10 border border-green-500/30 text-green-400 text-sm text-center font-medium block';
                
                // Clear the form
                document.getElementById('email').value = '';
                
            } catch (error) {
                console.error("Erro na comunicação com a API:", error);
                messageBanner.textContent = "Erro de ligação ao servidor. Verifique a consola para mais detalhes.";
                messageBanner.className = 'mb-6 p-4 rounded bg-red-500/10 border border-red-500/30 text-red-400 text-sm text-center font-medium block';
            } finally {
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Enviar E-mail de Recuperação';
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
