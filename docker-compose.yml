# =============================================================================
# PreviSwit AI-ASPM — Docker Compose v4
# =============================================================================
# Serviços:
#   previswit-server   → FastAPI + WebSocket Hub (host 10100 → container 10200)
#   previswit-agent    → Agente de Pentest Kali (cliente WS)
#   previswit-frontend → React/Vite + Nginx (porta 3000)
#
# Rede: previswit-net (bridge isolada)
# Volumes:
#   agent_reports (named)  → Relatórios gerados pelo agente (persistidos)
#   ./NewPrevy/data (bind) → JSON de dados ASPM (lidos diretamente do disco)
#
# IMPORTANTE sobre o bind mount de ./NewPrevy/data:
#   O container usa os arquivos REAIS do seu projeto.
#   Qualquer mudança nos JSONs é imediata — sem necessidade de rebuild.
#
# Uso:
#   cp .env.example .env  (preencha GEMINI_API_KEY)
#   docker compose up --build
# =============================================================================

version: "3.9"

# ---------------------------------------------------------------------------
# Volumes nomeados — apenas para dados que NAO precisam ser editados no host
# ---------------------------------------------------------------------------
volumes:
  agent_reports:
    driver: local
    labels:
      com.previswit.description: "Relatórios gerados pelo agente de pentest"
  # NOTA: previswit_data foi removido.
  # Os dados ASPM agora usam bind mount (./NewPrevy/data) para que
  # mudanças no host sejam refletidas imediatamente no container.

# ---------------------------------------------------------------------------
# Rede isolada — todos os containers se comunicam internamente
# ---------------------------------------------------------------------------
networks:
  previswit-net:
    driver: bridge
    labels:
      com.previswit.description: "Rede interna PreviSwit AI-ASPM"

# ---------------------------------------------------------------------------
# Serviços
# ---------------------------------------------------------------------------
services:

  # ===========================================================================
  # previswit-server
  # FastAPI v4 + WebSocket Hub — API REST + Orquestração de Scans
  # Porta: 10100 (host) → 10200 (container)
  # NOTA: o host usa 10100 porque o WinNAT/Hyper-V no Windows reserva a faixa
  # 10136-11135, o que impede o bind em 10200 (erro "socket ... forbidden").
  # A porta interna segue 10200 — rede do Docker não é afetada pela reserva.
  # ===========================================================================
  previswit-server:
    build:
      context: ./NewPrevy
      dockerfile: Dockerfile.server
    container_name: previswit-server
    restart: unless-stopped
    ports:
      - "10100:10200"
    environment:
      # Servidor
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "10200"
      APP_ENV: "${APP_ENV:-production}"

      # Segurança
      SECRET_KEY: "${SECRET_KEY:-previswit-changeme-replace-in-production}"
      TOKEN_EXPIRE_MINUTES: "${TOKEN_EXPIRE_MINUTES:-60}"

      # IA
      GEMINI_API_KEY: "${GEMINI_API_KEY}"

      # E-mail / Reset de Senha
      SITE_URL: "${SITE_URL:-http://localhost:3000}"
      SITE_NAME: "${SITE_NAME:-PreviSwit ASPM}"
      PASSWORD_RESET_TIMEOUT: "${PASSWORD_RESET_TIMEOUT:-3600}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      EMAIL_FROM: "${EMAIL_FROM:-}"

      # Python
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      # Bind mount direto: o container usa os arquivos REAIS do projeto.
      # Rebuild não apaga os dados. Mudanças nos JSONs são instantâneas.
      - ./NewPrevy/data:/app/data
      - agent_reports:/app/reports
      # Docker socket — necessário para o Trivy escanear imagens locais
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - previswit-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10200/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ===========================================================================
  # previswit-agent
  # Framework de Pentest (Kali Linux) — Nmap, Gobuster, Nuclei, Trivy
  # Escuta comandos do server via WebSocket
  # ===========================================================================
  previswit-agent:
    build:
      context: ./NewPrevy
      dockerfile: Dockerfile.agent
    container_name: previswit-agent
    restart: unless-stopped
    command: ["python3", "ws_listener.py"]
    environment:
      PREVISWIT_WS_URI: "ws://previswit-server:10200/ws/agent_01"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      REPORTS_DIR: "/app/reports"
      PYTHONUNBUFFERED: "1"
    volumes:
      - agent_reports:/app/reports
    networks:
      - previswit-net
    depends_on:
      previswit-server:
        condition: service_healthy

  # ===========================================================================
  # previswit-frontend
  # Dashboard React/Vite compilado → servido por Nginx Alpine
  # Proxy reverso interno: /api/* e /ws/* → previswit-server:10200
  # Porta: 3000 (host) → 80 (container)
  # ===========================================================================
  previswit-frontend:
    build:
      context: ./previswit-frontend
      dockerfile: Dockerfile
    container_name: previswit-frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:80"
    networks:
      - previswit-net
    depends_on:
      previswit-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
